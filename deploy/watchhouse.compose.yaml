services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    pull_policy: missing
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "3000"
      HTTP_CONTROL_SERVER_ADDRESS: ${WATCHHOUSE_HOST_CONTROL_ADDRESS:?Set WATCHHOUSE_HOST_CONTROL_ADDRESS in Arcane}
    ports:
      - "9096:3000"
    volumes:
      - gluetun-data:/gluetun
      - type: bind
        source: ${WATCHHOUSE_HOST_WIREGUARD_CONFIG:?Set WATCHHOUSE_HOST_WIREGUARD_CONFIG in Arcane}
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  watchhouse:
    image: scottlewis193/watchhouse:sha-206487ac548f6790637dbc292401fc307898d9fa
    pull_policy: missing
    platform: linux/amd64
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    devices:
      - /dev/dri:/dev/dri
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${WATCHHOUSE_HOST_ORIGIN:?Set WATCHHOUSE_HOST_ORIGIN in Arcane}
      LD_LIBRARY_PATH: /usr/local/nvidia/lib64
      WATCHHOUSE_BUNDLED_INDEXER: "true"
      WATCHHOUSE_PUBLIC_INDEXERS: limetorrents,thepiratebay
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      - watchhouse-data:/app/data
      - ${WATCHHOUSE_HOST_NVIDIA_LIBS:?Set WATCHHOUSE_HOST_NVIDIA_LIBS in Arcane}:/usr/local/nvidia/lib64:ro

volumes:
  gluetun-data:
  watchhouse-data:
    external: true
    name: watchhouse_watchhouse-data
