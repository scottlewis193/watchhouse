services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: "3000"
      HTTP_CONTROL_SERVER_ADDRESS: 127.0.0.1:8000
    ports:
      - "${WATCHHOUSE_BIND_ADDRESS:-127.0.0.1}:${WATCHHOUSE_PORT:-3000}:3000/tcp"
    volumes:
      - gluetun-data:/gluetun
      - type: bind
        source: ${WATCHHOUSE_WIREGUARD_CONFIG:-./vpn/wg0.conf}
        target: /gluetun/wireguard/wg0.conf
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

  watchhouse:
    image: ${WATCHHOUSE_IMAGE:-watchhouse:local}
    build: .
    platform: linux/amd64
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${WATCHHOUSE_ORIGIN:-http://localhost:3000}
      WATCHHOUSE_BUNDLED_INDEXER: "true"
      WATCHHOUSE_PUBLIC_INDEXERS: ${WATCHHOUSE_PUBLIC_INDEXERS:-limetorrents,torrentdownloads}
    volumes:
      - watchhouse-data:/app/data
    restart: unless-stopped

volumes:
  gluetun-data:
  watchhouse-data:
